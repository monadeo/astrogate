name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload the tarball
    outputs:
      version: ${{ steps.pack.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

      - name: Pack release tarball
        id: pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}."
            exit 1
          fi
          node scripts/pack.mjs
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 dist-release/astrogate-${VERSION}.tar.gz.sha256)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist-release/*.tar.gz dist-release/*.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes

  formula-bump:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Bump Homebrew formula
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          SHA256: ${{ needs.publish.outputs.sha256 }}
        run: |
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/monadeo/homebrew-tap.git" tap
          cd tap
          sed -i -E "s#^(  url \").*(\")\$#\1https://github.com/monadeo/astrogate/releases/download/v${VERSION}/astrogate-${VERSION}.tar.gz\2#" Formula/astrogate.rb
          sed -i -E "s#^(  sha256 \").*(\")\$#\1${SHA256}\2#" Formula/astrogate.rb
          git config user.name "monadeo-release-bot"
          git config user.email "release-bot@monadeo.com"
          git commit -am "astrogate ${VERSION}"
          git push
